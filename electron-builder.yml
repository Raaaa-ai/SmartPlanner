appId: com.smartplanner.app
productName: SmartPlanner
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
